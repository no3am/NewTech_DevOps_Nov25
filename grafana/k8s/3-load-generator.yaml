# ---
# Load generator: hits the custom API in a loop to generate traffic
# Scale replicas to see the spike in Grafana (e.g. replicas=10)
# ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: monitoring
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-generator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -qO- http://custom-api-service/ || true
                wget -qO- http://custom-api-service/error || true
                sleep 2
              done
