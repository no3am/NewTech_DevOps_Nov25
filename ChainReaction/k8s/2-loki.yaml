# ---
# Loki: single-binary deployment for log storage; Grafana queries via 3100.
# ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: chain-reaction
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    distributor:
      ring:
        kvstore:
          store: inmemory
      pool:
        health_check_ingesters: true

    ingester:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1
      min_ready_duration: 0s
      final_sleep: 0s

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /var/loki/tsdb
      tsdb:
        dir: /var/loki/tsdb
      bucket_store:
        sync_dir: /var/loki/tsdb-sync

    compactor:
      data_dir: /var/loki/compactor

    ruler_storage:
      backend: local
      local:
        directory: /var/loki/rules
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: chain-reaction
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:latest
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /var/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: chain-reaction
  labels:
    app: loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: loki
